[package]
name = "oxc_formatter_css"
version = "0.80.0"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/oxc-project/oxc"
rust-version = "1.98.0"
description = "oxfmt's CSS formatter, patched for Prettier parity (see PATCHES.md)."

[dependencies]
cow-utils = "0.1.3"
oxc_allocator = { git = "https://github.com/oxc-project/oxc", rev = "846e62abbbf7c646844a4b8729210dbe2317f5c7" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", rev = "846e62abbbf7c646844a4b8729210dbe2317f5c7" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", rev = "846e62abbbf7c646844a4b8729210dbe2317f5c7" }
oxc_span = { git = "https://github.com/oxc-project/oxc", rev = "846e62abbbf7c646844a4b8729210dbe2317f5c7" }
phf = { version = "0.14.0", features = ["macros"] }
smallvec = { version = "1.15.2", features = ["union", "serde"] }
oxc-css-parser = "0.0.22"

[lib]
doctest = false
