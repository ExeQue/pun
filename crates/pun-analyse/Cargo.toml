[package]
name = "punphp-analyse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false
# A symlink back to the fixture's own vendor directory, so cargo's package walk would loop.
exclude = ["tests/fixtures/larastan-types/root/vendor/orchestra/testbench-core/laravel/vendor"]

[lib]
name = "pun_analyse"

[[test]]
name = "analyse"
path = "tests/main.rs"

[dependencies]
pun-phpstan.workspace = true
pun-tokens.workspace = true
pcre2.workspace = true
regex-automata.workspace = true
mago-allocator.workspace = true
mago-analyzer.workspace = true
mago-codex.workspace = true
mago-database.workspace = true
mago-names.workspace = true
mago-phpdoc-syntax.workspace = true
mago-prelude.workspace = true
mago-php-version.workspace = true
mago-word.workspace = true
mago-span.workspace = true
mago-syntax.workspace = true
serde_json.workspace = true
rayon.workspace = true
bitflags.workspace = true
foldhash.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
# Larastan's stubs, for Laravel apps without Larastan installed.
include_dir = "0.7"

[dev-dependencies]
mago-reporting.workspace = true
mago-codex = { workspace = true, features = ["serde"] }
mago-extension = "=1.57.0"

[lints]
workspace = true
