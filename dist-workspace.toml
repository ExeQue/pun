[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
include = ["licenses/THIRD_PARTY_NOTICES.md", "licenses/THIRD_PARTY_LICENSES.md"]
ci = "github"
installers = []
github-release = "announce"
github-attestations = true
github-attestations-phase = "announce"
github-attestations-filters = ["*.tar.gz"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
unix-archive = ".tar.gz"
source-tarball = false
github-build-setup = "../build-setup.yml"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
