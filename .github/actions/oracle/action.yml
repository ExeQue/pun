name: Oracle
description: PHP 8.5, Node, and the pinned Pint / PHP-CS-Fixer / PHPStan oracle in .oracle/ (scripts/oracle.sh), cached.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.5'
        tools: composer
        coverage: none
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .oracle
        key: oracle-${{ hashFiles('scripts/oracle.sh', 'scripts/oracle-phpstan/composer.lock') }}
    - shell: bash
      run: scripts/oracle.sh
    # Blade fixture tests resolve prettier from crates/pun-fixers/node_modules.
    - shell: bash
      run: if [ -f crates/pun-fixers/package.json ]; then npm install --prefix crates/pun-fixers --no-audit --no-fund; fi
