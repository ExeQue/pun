[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party/mago-analyzer", "third_party/mago-codex", "third_party/mago-syntax", "third_party/mago-phpdoc-syntax"]

[patch.crates-io]
mago-analyzer = { path = "third_party/mago-analyzer" }
mago-codex = { path = "third_party/mago-codex" }
mago-syntax = { path = "third_party/mago-syntax" }
mago-phpdoc-syntax = { path = "third_party/mago-phpdoc-syntax" }

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/shipfastlabs/pun"
# Pun ships only as the punphp/pun Composer package (composer/), never to crates.io.
publish = false
# The Mago crates need rustc 1.99.
rust-version = "1.99"

[workspace.dependencies]
pun-analyse = { path = "crates/pun-analyse", package = "punphp-analyse" }
pun-config = { path = "crates/pun-config", package = "punphp-config" }
pun-extension = { path = "crates/pun-extension", package = "punphp-extension" }
pun-fixers = { path = "crates/pun-fixers", package = "punphp-fixers" }
pun-format = { path = "crates/pun-format", package = "punphp-format" }
pun-lint = { path = "crates/pun-lint", package = "punphp-lint" }
pun-packages = { path = "crates/pun-packages", package = "punphp-packages" }
pun-phpstan = { path = "crates/pun-phpstan", package = "punphp-phpstan" }
pun-problem = { path = "crates/pun-problem", package = "punphp-problem" }
pun-tokens = { path = "crates/pun-tokens", package = "punphp-tokens" }
pun-workspace = { path = "crates/pun-workspace", package = "punphp-workspace" }

# Env-only: the default `process-tree` feature (sysinfo) adds ~12 ms per start and finds agents up the process tree.
agent-detector = { version = "=0.2.1", default-features = false }
anyhow = "1"
bitflags = "2"
# pun-cli: the result cache's hashes
blake3 = "1"
clap = { version = "4", features = ["derive"] }
# `pun migrate`'s checklist; no editor/password/fuzzy features.
dialoguer = { version = "0.12", default-features = false }
flate2 = "1"
# pun-analyse: the on-demand autoload index; pun-tokens: the token collection's lookup maps
foldhash = "0.2"
indexmap = "2"
libc = "0.2"
mago-allocator = "=1.57.0"
mago-analyzer = "=1.57.0"
mago-codex = "=1.57.0"
mago-database = "=1.57.0"
mago-names = "=1.57.0"
mago-php-version = "=1.57.0"
mago-phpdoc-syntax = "=1.57.0"
mago-prelude = { version = "=1.57.0", features = ["build"] }
mago-reporting = "=1.57.0"
mago-span = "=1.57.0"
mago-syntax = "=1.57.0"
mago-syntax-core = "=1.57.0"
mago-word = "=1.57.0"
# `pun format --format=gitlab`: PHP-CS-Fixer's md5 fingerprints.
md-5 = "0.11"
# pun-cli's global allocator on musl. Without transparent huge pages a resolve peaks at 227 MB rather than 411 MB.
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }
notify = "8"
pcre2 = "0.2"
pcre2-sys = "0.2"
# pun-cli's `pprof` feature: an in-process sampling profiler.
pprof = { version = "0.15", default-features = false }
rayon = "1"
regex = "1"
regex-automata = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha1 = "0.11"
# `pun analyse --format=gitlab`: PHPStan's sha256 fingerprints.
sha2 = "0.11"
similar = "2"
tar = { version = "0.4.46", default-features = false }
toml = { version = "0.9", features = ["preserve_order"] }
# `pun install`: Packagist metadata and dist downloads over HTTPS (rustls with the Mozilla roots, gzip).
ureq = "3.5"
walkdir = "2"
# Local phar:// member stat: archive indexes, gzip containers and PHAR signatures only.
zip = { version = "9.1.1", default-features = false }

# Pun's lint policy: all of pedantic. A crate opts in with `[lints] workspace = true`, and CI runs clippy with
# `-D warnings`. The crates that port upstream PHP function by function (pun-tokens, pun-format, pun-fixers,
# pun-lint, pun-phpstan, pun-analyse) carry their own `[lints]` table instead: this policy plus the allows the
# port shape needs. Cargo cannot extend an inherited table, so a change here goes into those six tables too.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every crate is internal (`publish = false`), so no API attributes or doc sections for outside callers.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pairs such as `requires` and `required`, or `pre` and `post`, are the right names.
similar_names = "allow"
# `assert_eq!(x, [])` prints the unexpected items; `assert!(x.is_empty())` does not.
assert_is_empty = "allow"
# Restriction lints worth having:
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_collect = "warn"

# Tests and debug builds run Mago and the other dependencies optimized (about 1.8x on the analyse fixture suites),
# with line tables only, so the test binaries stay small; Pun's own crates stay unoptimized so they
# rebuild fast.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# Symbols are 15% of the binary (75 MB to 64 MB on Linux x86_64). Panic messages keep their file and line.
strip = true

# Benchmarks and `perf`: release speed with line tables, cheap to build on a small box
# (`CARGO_BUILD_JOBS=1 cargo build --profile profiling -p punphp`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
codegen-units = 16
